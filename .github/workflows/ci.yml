name: Проверки и ZIP
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run archive
      - uses: actions/upload-artifact@v4
        with:
          name: AK47-Interactive-Atlas
          path: AK47-Interactive-Atlas.zip
      - uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            artifacts
          retention-days: 14
